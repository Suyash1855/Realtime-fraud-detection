name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install serving dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.0.2 scikit-learn==1.6.1 \
                      xgboost==2.1.4 mlflow==3.1.4 kafka-python==3.0.1 \
                      redis==7.0.1 fastapi==0.128.8 "uvicorn[standard]" \
                      prometheus-client prometheus-fastapi-instrumentator==7.1.0 \
                      pytest

      - name: Byte-compile every module
        run: python -m compileall -q consumer.py producer.py features.py train_fraud_model.py API scripts tests

      - name: Import the API and the scorer
        run: |
          python -c "import consumer, producer"
          python -c "from API.main import app; print(len(app.routes), 'routes')"
        env:
          API_KEY: ci-placeholder

      # Skips the parity assertions that need the 1.3 GB IEEE-CIS CSVs, which are
      # not in the repo; everything import- and contract-shaped still runs.
      - name: Tests
        run: pytest tests/ -q

      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build images
        run: |
          docker build -f Dockerfile.pipeline -t fraud-pipeline:ci .
          docker build -f Dockerfile.mlflow -t fraud-mlflow:ci .
          docker build -f Dockerfile -t fraud-console:ci .

      # The pipeline image must build from a clean checkout. artifacts/ is
      # gitignored, so a COPY of it here would pass locally and fail in CI.
      - name: Pipeline image starts without a baked contract
        run: |
          docker run --rm fraud-pipeline:ci python -c "import consumer, producer; from API.main import app"
        env:
          API_KEY: ci-placeholder
