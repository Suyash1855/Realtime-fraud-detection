global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:

  # Fraud read API (API/main.py) — prometheus_fastapi_instrumentator exposes
  # /metrics. Container port 8000; the 8200 host mapping is not used from here.
  - job_name: "fastapi"
    static_configs:
      - targets:
          - "fraud-api:8000"
        labels:
          service: "fraud-api"

  # Kafka consumer / scorer. Must be 8002, not 8001: redis-stack publishes
  # RedisInsight on 8001, so the consumer cannot bind there at all.
  #
  # DNS discovery rather than a static target: Docker's embedded DNS returns one
  # A record per replica, so `--scale fraud-consumer=N` is scraped in full. A
  # static_config would resolve the name once and monitor a single replica.
  - job_name: "fraud-consumer"
    dns_sd_configs:
      - names:
          - "fraud-consumer"
        type: A
        port: 8002
    relabel_configs:
      - target_label: service
        replacement: "fraud-consumer"

  # Prometheus scraping itself, so the monitoring stack is observable too.
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
